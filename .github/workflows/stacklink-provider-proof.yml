name: Stacklink Provider Proof
run-name: ${{ inputs.proof_id }}

on:
  workflow_dispatch:
    inputs:
      proof_id:
        description: Exact Stacklink staging proof identity
        required: true
        type: string
      delay_seconds:
        description: Bounded delay used only to prove exact cancellation
        required: false
        default: "0"
        type: string
      issue_number:
        description: Exact issue number for attributed bot-evidence validation
        required: false
        default: ""
        type: string
      bot_comment:
        description: Exact controlled bot comment body
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Apply bounded cancellation window
        run: sleep "${{ inputs.delay_seconds }}"
      - name: Add exact bot evidence
        if: inputs.issue_number != '' && inputs.bot_comment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BOT_COMMENT: ${{ inputs.bot_comment }}
        run: gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" -f "body=${BOT_COMMENT}"
      - name: Create bounded proof artifact
        run: |
          mkdir -p proof
          printf '%s\n' "${{ inputs.proof_id }}" > proof/result.txt
      - name: Upload bounded proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.proof_id }}
          path: proof/result.txt
          retention-days: 1
